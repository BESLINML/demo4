# ===========================================================================
#  Do NOT edit this file by hand.
#  Double-click setup.bat - it fills this in and creates the database for you.
# ===========================================================================
spring:
  profiles:
    active: prod
  datasource:
    # 127.0.0.1 rather than "localhost": localhost can resolve to IPv6 ::1,
    # which pg_hba.conf often authenticates differently from 127.0.0.1.
    url: jdbc:postgresql://127.0.0.1:5432/hms
    username: postgres
    password: CHANGE_ME_RUN_SETUP_BAT

server:
  port: 8226

hms:
  jwt:
    access-secret: CHANGE_ME_RUN_SETUP_BAT_TO_GENERATE_A_REAL_SECRET
    refresh-secret: CHANGE_ME_RUN_SETUP_BAT_TO_GENERATE_ANOTHER_SECRET
  super-admin:
    email: admin@hospital.local
    password: CHANGE_ME_RUN_SETUP_BAT
  hospital:
    name: City Care Hospital
    state: Karnataka
    gstin: none
  cors:
    allowed-origins: http://localhost:8226
  web:
    dist-path: ./web

# Log file location, relative to this folder. Change it to move the logs.
# Rotates on its own: 50MB per file, keeps 30 days, gzipped, 2GB total.
logging:
  file:
    name: ./logs/hms-api.log
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 30
      total-size-cap: 2GB